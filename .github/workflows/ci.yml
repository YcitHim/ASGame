name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: lint（含 G3 核心层确定性规则）
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: content-validator（G1）
        run: npm run validate
      - name: unit tests（Vitest，含 golden replay 6+1 盘重放）
        run: npm test
      # 双幕模拟：样本量 400、胜率 2.5%——策划已裁定「无典型状态」的模拟指标不作门禁，
      # 仅作记录。需要复现时手动执行：npm run sim:2act
